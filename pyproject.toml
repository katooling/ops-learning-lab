[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-learning-lab"
version = "0.1.0"
description = "A local, evidence-aware learning environment for operational judgment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Mohamad Kamar" }
]
keywords = [
  "learning",
  "provenance",
  "simulation",
  "operations"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/katooling/ops-learning-lab"
Issues = "https://github.com/katooling/ops-learning-lab/issues"

[project.scripts]
opslearn = "ops_learning_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
